[workspace.package]
version = "0.1.0"
authors = ["Gono Protocol Foundation"]
edition = "2021"
license = "MIT-0"
repository = "https://github.com/gono-protocol"

[workspace]
resolver = "2"
members = [
    "chain/runtime",
    "pallets/store",
    "pallets/verify",
    "pallets/privacy",
    "pallets/x402",
    "pallets/kleros-bridge",
]

[workspace.lints.rust]
suspicious_double_ref_op = { level = "allow", priority = 2 }
deprecated = { level = "allow", priority = 2 }

[workspace.lints.clippy]
all = { level = "warn", priority = 0 }
too_many_arguments = { level = "allow", priority = 2 }
type_complexity = { level = "allow", priority = 2 }
needless_borrows_for_generic_args = { level = "allow", priority = 2 }
let_unit_value = { level = "allow", priority = 2 }

[workspace.dependencies]
# Gono Internal Pallets & Runtime
pallet-gono-store = { path = "pallets/store", default-features = false }
pallet-gono-verify = { path = "pallets/verify", default-features = false }
pallet-gono-privacy = { path = "pallets/privacy", default-features = false }
pallet-gono-x402 = { path = "pallets/x402", default-features = false }
pallet-kleros-bridge = { path = "pallets/kleros-bridge", default-features = false }
gono-runtime = { path = "chain/runtime", default-features = false }

# Polkadot SDK Umbrella & Tooling
polkadot-sdk = { version = "2606.0.0", default-features = false }
frame = { version = "0.14.0", default-features = false, package = "polkadot-sdk-frame" }
cumulus-pallet-parachain-system = { version = "0.29.0", default-features = false }
substrate-wasm-builder = { version = "34.0.0", default-features = false }

# Direct FRAME & Substrate Crates (Aligned with Polkadot SDK 2606.0.0)
frame-support = { version = "48.0.0", default-features = false }
frame-system = { version = "48.0.0", default-features = false }
pallet-balances = { version = "50.0.0", default-features = false }
sp-core = { version = "43.0.0", default-features = false }
sp-io = { version = "48.0.0", default-features = false }
sp-runtime = { version = "48.0.0", default-features = false }

# Common Utilities
codec = { version = "3.7.5", default-features = false, package = "parity-scale-codec", features = ["derive", "max-encoded-len"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
serde = { version = "1.0.214", default-features = false }
serde_json = { version = "1.0.132", default-features = false }
smallvec = { version = "1.11.0", default-features = false }
log = { version = "0.4.22", default-features = false }
docify = { version = "0.2.9" }
hex-literal = { version = "0.4.1", default-features = false }

[profile.release]
opt-level = 3
panic = "unwind"

[profile.production]
codegen-units = 1
inherits = "release"
lto = true
